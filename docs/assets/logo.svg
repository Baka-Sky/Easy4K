<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Easy4K">
  <title>Easy4K</title>
  <defs>
    <linearGradient id="bg" x1="16" y1="16" x2="1008" y2="1008" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16224A"/>
      <stop offset="1" stop-color="#070B1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EC6FF" stop-opacity="0.47"/>
      <stop offset="1" stop-color="#3EC6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BD0FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="ink" x1="300" y1="330" x2="724" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4DCFF"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="992" height="992" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="992" height="992" fill="url(#bg)"/>
    <rect x="16" y="16" width="992" height="992" fill="url(#glow)"/>
  </g>
  <rect x="18" y="18" width="988" height="988" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <g fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 430V240H430"/>
    <path d="M594 240H784V430"/>
    <path d="M784 594V784H594"/>
    <path d="M430 784H240V594"/>
  </g>

  <text x="512" y="660" text-anchor="middle" font-family="'Segoe UI Black','Segoe UI',system-ui,sans-serif"
        font-size="372" font-weight="900" fill="url(#ink)">4K</text>

  <g>
    <rect x="378" y="700" width="72" height="18" rx="9" fill="#FF6B6B"/>
    <rect x="476" y="700" width="72" height="18" rx="9" fill="#52D98A"/>
    <rect x="574" y="700" width="72" height="18" rx="9" fill="#5BA8FF"/>
